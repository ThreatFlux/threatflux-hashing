[workspace]

[package]
name = "threatflux-hashing"
version = "1.7.1"
edition = "2021"
rust-version = "1.95.0"
authors = ["ThreatFlux"]
description = "High-performance async file hashing library supporting MD5, SHA256, SHA512, and BLAKE3"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-hashing"
keywords = ["hash", "crypto", "async", "hashing"]
categories = ["cryptography", "filesystem", "asynchronous"]
readme = "README.md"

[dependencies]
blake3 = "1.8.7"
md-5 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "fs", "sync"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.21"
futures = "0.3.34"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
hex = "0.4.3"
serde_json = "1.0.154"
pretty_assertions = "1.4.1"

[features]
default = ["serde"]
serde = ["dep:serde"]

[[bench]]
name = "hash_benchmarks"
harness = false
