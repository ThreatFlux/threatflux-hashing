name: Auto Release

# Key on the head repository too, so a fork pull request whose branch is named
# "main" cannot cancel an in-progress release for this repository's main. Dry
# runs use their own group so a rehearsal never cancels a real release.
concurrency:
  group: auto-release-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

# workflow_run is intended here: the reusable workflow's gate releases only
# after a successful CI/Security run for this repository (fork runs are
# refused), so it only ever builds commits already on this repository's main.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  verify-release-source:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the merged release proposal for an untagged version
        if: >-
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          repo="repos/${GITHUB_REPOSITORY}"
          version=$(gh api "$repo/contents/Cargo.toml?ref=$TARGET_SHA" --jq .content |
            base64 --decode |
            python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_refs=$(gh api "$repo/git/matching-refs/tags/v$version" --jq '.[].ref')
          if grep -Fxq "refs/tags/v$version" <<< "$tag_refs"; then
            exit 0
          fi

          # The reusable workflow tags an untagged manifest version at the
          # tested head. A later main commit must not inherit that version.
          proposal_merges=$(gh api --paginate "$repo/commits/$TARGET_SHA/pulls" --jq '
            .[] | select(.merged_at != null and .base.ref == "main" and
              .head.ref == "automation/release" and .head.repo.full_name == .base.repo.full_name)
            | .merge_commit_sha')
          if ! grep -Fxq "$TARGET_SHA" <<< "$proposal_merges"; then
            echo "::error::Untagged version v$version must be released from its tested release PR merge commit."
            exit 1
          fi

  release:
    needs: verify-release-source
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@240529daaf569ee1f5b5e22f683b113ec4e1d62d  # v0.7.13
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      create-pr: true
      # The ThreatFlux automation App pushes the release tag, which starts
      # release.yml through its `push: tags` trigger, so the reusable workflow
      # dispatches nothing on that path. release.yml is dispatched (with the
      # version input) only if the release falls back to GITHUB_TOKEN.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
