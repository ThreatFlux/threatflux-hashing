---
version: 2

multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    # chore: subjects never trigger auto-release on their own.
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
